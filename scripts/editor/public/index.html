<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huawei Deck 编辑器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/editor/editor.css">
</head>
<body>
  <main class="editor-shell">
    <header class="topbar">
      <div class="brand-block">
        <img class="brand-logo" src="/editor/huawei-logo.png" alt="Huawei">
        <span class="topbar-divider" aria-hidden="true"></span>
        <div>
          <h1>Deck 可视化编辑器</h1>
          <p>本地协作工作台</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span class="ws-status" data-ws-state="connecting" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-ws-label>正在连接</span>
        </span>
        <span class="mode-badge">预览模式</span>
      </div>
    </header>

    <section class="workspace" aria-label="Deck 编辑工作台">
      <aside class="panel page-panel" aria-label="页面列表">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">DECK</p>
            <h2>页面</h2>
          </div>
          <span class="page-count" data-page-count>0 页</span>
        </div>
        <nav class="page-list" data-page-list aria-label="幻灯片页面">
          <div class="loading-state">正在读取页面…</div>
        </nav>
      </aside>

      <section class="canvas-column" aria-label="画布">
        <div class="canvas-toolbar">
          <div>
            <strong data-current-page>尚未载入</strong>
            <span data-current-key>等待 Deck 响应</span>
          </div>
          <div class="canvas-tools" aria-label="画布状态">
            <div class="mode-tools" role="toolbar" aria-label="编辑模式">
              <button class="mode-button" type="button" data-mode="preview" aria-pressed="true">预览</button>
              <button class="mode-button" type="button" data-mode="region" aria-pressed="false">区域标记</button>
              <button class="mode-button" type="button" data-mode="text" aria-pressed="false">文字</button>
              <button class="mode-button" type="button" data-mode="move" aria-pressed="false">移动</button>
              <button class="mode-button" type="button" data-mode="resize" aria-pressed="false">缩放</button>
            </div>
            <span>1920 × 1080</span>
            <span class="zoom-value" data-zoom>—</span>
            <span class="revision-value">R<span data-revision>0</span></span>
          </div>
        </div>
        <div class="frame-viewport" data-frame-viewport>
          <div class="frame-scene" data-frame-scene>
            <iframe id="deck-frame" title="Deck 预览" referrerpolicy="same-origin"></iframe>
          </div>
        </div>
      </section>

      <aside class="panel inspector-panel" aria-label="属性面板">
        <div class="panel-heading inspector-heading">
          <div>
            <p class="eyebrow">INSPECTOR</p>
            <h2>属性</h2>
          </div>
          <span class="selection-state">未选中</span>
        </div>
        <div class="inspector-empty">
          <div class="selection-frame" aria-hidden="true"></div>
          <h3>选择文字或画面元素开始编辑</h3>
          <p>文字双击进入，Cmd/Ctrl+Enter 提交，Escape 取消；移动与缩放用拖拽提交，所有动作均可统一撤销。</p>
        </div>
        <section class="agent-placeholder" data-agent-placeholder aria-label="Agent 任务面板占位">
          <div>
            <p class="eyebrow">AGENT</p>
            <h3>任务面板</h3>
          </div>
          <span>下一阶段启用</span>
        </section>
      </aside>
    </section>
    <aside class="task-drawer" data-task-drawer aria-label="Agent 修改任务"></aside>
  </main>
  <script type="module" src="/editor/editor.mjs"></script>
</body>
</html>
